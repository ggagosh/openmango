# Build optimizations for macOS
# Requires: brew install lld

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld"]
runner = "./scripts/cargo_runner_macos.sh"

# Link the C runtime statically so the app runs on Windows without the VC++ redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld"]
runner = "./scripts/cargo_runner_macos.sh"
