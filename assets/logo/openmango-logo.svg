<svg
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="OpenMango logo"
>
  <defs>
    <linearGradient id="backgroundGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292A2E"/>
      <stop offset="100%" stop-color="#17181B"/>
    </linearGradient>
    <linearGradient id="mangoGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB02E"/>
      <stop offset="100%" stop-color="#FF8917"/>
    </linearGradient>
    <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78DC53"/>
      <stop offset="100%" stop-color="#43B83F"/>
    </linearGradient>
  </defs>

  <!-- Transparent outer corners keep the icon native to the macOS Dock. -->
  <rect x="64" y="64" width="896" height="896" rx="196" fill="url(#backgroundGradient)"/>

  <path
    fill="url(#mangoGradient)"
    d="
      M482 250
      C372 250 292 353 284 496
      C275 652 363 807 492 837
      C620 867 720 728 741 574
      C758 451 721 352 641 292
      L556 355
      L535 262
      C518 254 500 250 482 250
      Z
    "
  />

  <!-- Strong negative-space data layers remain legible at small Dock sizes. -->
  <g fill="url(#backgroundGradient)">
    <ellipse cx="512" cy="486" rx="154" ry="31"/>
    <ellipse cx="512" cy="580" rx="154" ry="31"/>
    <ellipse cx="512" cy="674" rx="154" ry="31"/>
  </g>

  <path
    fill="url(#leafGradient)"
    d="
      M542 249
      C565 207 590 180 620 166
      C699 153 766 172 813 220
      C710 221 627 261 561 329
      C558 296 551 269 542 249
      Z
    "
  />
</svg>
