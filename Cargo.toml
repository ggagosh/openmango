[package]
name = "openmango"
version = "0.2.1"
edition = "2024"
description = "A GPU-accelerated MongoDB client built with GPUI"
license = "GPL-3.0"
homepage = "https://openmango.app"
repository = "https://github.com/ggagosh/openmango"
categories = ["database", "gui", "development-tools"]
keywords = ["mongodb", "database", "gui", "gpui", "macos"]

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
gpui-kit = { version = "0.6.0", features = ["tree-sitter-languages"] }
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
lsp-types = "0.97"
mongodb = { version = "3.5", features = ["socks5-proxy", "cert-key-password"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3"
dirs = "6.0"
rig-core = "0.31"
uuid = { version = "1.21", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
mimalloc = { version = "0.1", optional = true }
rust-embed = "8.11"
futures = "0.3"
rfd = "0.17"
csv = "1.4"
which = "8.0"
flate2 = "1.1"
encoding_rs = "0.8"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
] }
semver = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.10"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tempfile = "3.26"
rust_xlsxwriter = { version = "0.93", features = ["constant_memory"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
tokio-util = "0.7.19"
tower-http = { version = "0.6.8", features = ["limit"] }
schemars = "1.2.1"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
minisign-verify = "=0.2.5"

[dev-dependencies]
gpui-kit = { version = "0.6.0", features = ["test-support"] }
cargo-husky = { version = "1", default-features = false, features = [
    "user-hooks",
] }
fast-socks5 = "1.0.0"
rmcp = { version = "=3.1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["mongo"] }

[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"
codegen-units = 256
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
