[package]
name = "openmango"
version = "0.3.0"
edition = "2024"
description = "A GPU-accelerated MongoDB client built with GPUI"
license = "GPL-3.0"
homepage = "https://openmango.app"
repository = "https://github.com/ggagosh/openmango"
categories = ["database", "gui", "development-tools"]
keywords = ["mongodb", "database", "gui", "gpui", "macos"]

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
# JavaScript covers query editors and Forge; the base tree-sitter feature adds JSON.
gpui-kit = { version = "0.6.2", features = ["tree-sitter-javascript"] }
# Builds on the same gpui-pre as gpui-kit; bump the two together.
gpui-fps = "0.6.2"
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
lsp-types = "0.97"
mongodb = { version = "3.5", features = ["socks5-proxy", "cert-key-password"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3"
dirs = "6.0"
# Default `reqwest-rustls` selects aws-lc; reqwest below keeps its charset and http2.
# 0.41 split rig-core into contracts + rig-agent; the `rig` facade re-exports both.
# `reqwest-middleware` is what lets a retrying HTTP client be handed to a provider client.
rig = { version = "0.42", features = ["reqwest-middleware"] }
# Sliding-window and token-budget policies for conversation memory.
rig-memory = "0.42"
reqwest-middleware = { version = "0.5", default-features = false }
reqwest-retry = "0.9"
uuid = { version = "1.21", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
mimalloc = { version = "0.1", optional = true }
rust-embed = "8.11"
futures = "0.3"
rfd = "0.17"
csv = "1.4"
which = "8.0"
flate2 = "1.1"
encoding_rs = "0.8"
regex = "1"
# TLS uses ring, which mongodb already requires; main installs it as the process provider.
# reqwest's `rustls` feature would compile aws-lc as a second crypto library.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "json",
    "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
semver = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.10"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tempfile = "3.26"
rust_xlsxwriter = { version = "0.93", features = ["constant_memory"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
tokio-util = "0.7.19"
tower-http = { version = "0.6.8", features = ["limit"] }
schemars = "1.2.1"
# SQLCipher rather than plain SQLite: the assistant's conversation store is encrypted whole —
# file, indexes, WAL and journals — with a key from the OS keychain. A database opened without a
# key behaves exactly like SQLite, so the change-history store is unaffected.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
minisign-verify = "=0.2.5"

# Build scripts run on the host; Windows packages are built on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.6.2", features = ["test-support"] }
cargo-husky = { version = "1", default-features = false, features = [
    "user-hooks",
] }
fast-socks5 = "1.0.0"
# Tests build HTTP clients without running main; testcontainers compiles aws-lc for tests anyway.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp ={ version = "=3.1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["mongo"] }

[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"
codegen-units = 256
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
